---
layout: default
---

<article>
  <header class="post-header">
    <time class="gutter" datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%Y-%m-%d" }}</time>
    <h1>{{ page.title | markdownify | remove: "<p>" | remove: "</p>" | strip }}</h1>
  </header>

  <div class="prose">
    {{ content }}
  </div>
</article>
