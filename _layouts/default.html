<!doctype html>
<html lang="{{ site.locale | slice: 0, 2 | default: 'en' }}">
  <head>
    {% include head.html %}
  </head>
  <body{% if page.layout == "home" %} class="home"{% endif %}>
    <div class="page">
      <header class="site-header">
        <a class="site-mark" href="{{ '/' | relative_url }}" tabindex="-1" aria-hidden="true">{% include mark.html %}</a>
        {%- if page.layout == "home" %}
        <h1 class="site-name"><a href="{{ '/' | relative_url }}">{{ site.title }}</a></h1>
        {%- else %}
        <p class="site-name"><a href="{{ '/' | relative_url }}">{{ site.title }}</a></p>
        {%- endif %}
        <nav>
          <a href="{{ '/about/' | relative_url }}"{% if page.url == "/about/" %} aria-current="page"{% endif %}>About</a>
        </nav>
      </header>

      <main>
        {{ content }}
      </main>

      <footer class="site-footer">
        <a href="https://github.com/{{ site.author.github }}">GitHub</a>
        <a href="{{ '/feed.xml' | relative_url }}">RSS feed</a>
      </footer>
    </div>
    {% include scripts.html %}
  </body>
</html>
