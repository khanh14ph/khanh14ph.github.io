{%- comment -%}
  The site mark: a 4x4 block of tiles with one row and one column picked out,
  and the cell where they meet. It is the picture of a matrix product.
{%- endcomment -%}
<svg class="mark" viewBox="0 0 26 26" width="26" height="26" aria-hidden="true" focusable="false">
  <rect class="mark-col" style="--k:0" x="14" y="0" width="5" height="5"/>
  <rect class="mark-row" style="--k:0" x="0" y="7" width="5" height="5"/>
  <rect class="mark-row" style="--k:1" x="7" y="7" width="5" height="5"/>
  <rect class="mark-hit" x="14" y="7" width="5" height="5"/>
  <rect class="mark-row" style="--k:3" x="21" y="7" width="5" height="5"/>
  <rect class="mark-col" style="--k:2" x="14" y="14" width="5" height="5"/>
  <rect class="mark-col" style="--k:3" x="14" y="21" width="5" height="5"/>
  <g class="mark-rest">
    <rect x="0" y="0" width="5" height="5"/><rect x="7" y="0" width="5" height="5"/><rect x="21" y="0" width="5" height="5"/>
    <rect x="0" y="14" width="5" height="5"/><rect x="7" y="14" width="5" height="5"/><rect x="21" y="14" width="5" height="5"/>
    <rect x="0" y="21" width="5" height="5"/><rect x="7" y="21" width="5" height="5"/><rect x="21" y="21" width="5" height="5"/>
  </g>
</svg>
