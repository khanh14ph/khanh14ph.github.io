# Site settings
locale                   : "en-US"
title                    : "Khanh Nguyen"
description              : "High Performance Computing Engineer focusing on GPU and AI"
url                      : https://khanh14ph.github.io
baseurl                  : ""
repository               : "khanh14ph/khanh14ph.github.io"

author:
  name             : "Khanh Nguyen"
  github           : "khanh14ph"

# Reading
future                   : true
encoding                 : "utf-8"
markdown_ext             : "markdown,mkdown,mkdn,mkd,md"
include:
  - _pages
exclude:
  - .bundle
  - .github
  - .sass-cache
  - Dockerfile
  - docker-compose.yaml
  - Gemfile
  - Gemfile.lock
  - local
  - node_modules
  - push.sh
  - README.md
  - vendor
keep_files:
  - .git

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
# The first paragraph of a post is its excerpt, shown on the homepage.
excerpt_separator: "\n\n"
incremental: false

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# Defaults
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: pages
    values:
      layout: page

# Outputting
permalink: /:categories/:title/
timezone: Etc/UTC

# Plugins
plugins:
  - jekyll-sitemap
  - jekyll-redirect-from

# Mimic GitHub Pages with --safe
whitelist:
  - jekyll-sitemap
  - jekyll-redirect-from
