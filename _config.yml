# Site settings
locale                   : "en-US"
site_theme               : "default" # "default", "air", "sunrise", "mint", "dirt" or "contrast"
title                    : "Khanh Nguyen"
title_separator          : "-"
name                     : &name "Khanh Nguyen"
description              : &description "High Performance Computing Engineer focusing on GPU and AI"
url                      : https://khanh14ph.github.io
baseurl                  : ""
repository               : "khanh14ph/khanh14ph.github.io"

# Author sidebar. Any blank/absent field is simply not rendered.
# See _includes/author-profile.html for the full list of supported fields.
author:
  avatar           : "avatar.jpeg"
  name             : "Khanh Nguyen"
  bio              : "High Performance Computing Engineer, focusing on GPU and AI."
  location         : "Earth"
  email            : "khanh14ph@gmail.com"
  github           : "khanh14ph"

# Reading
words_per_minute         : 160
future                   : true
encoding                 : "utf-8"
markdown_ext             : "markdown,mkdown,mkdn,mkd,md"
include:
  - .htaccess
  - _pages
exclude:
  - .bundle
  - .github
  - .sass-cache
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - Dockerfile
  - docker-compose.yaml
  - Gemfile
  - LICENSE
  - local
  - node_modules
  - package.json*
  - README.md
  - vendor
keep_files:
  - .git

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# Defaults
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      share: true
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true

# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed

# Outputting
permalink: /:categories/:title/
timezone: Etc/UTC

# Plugins
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-redirect-from

# Mimic GitHub Pages with --safe
whitelist:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-redirect-from

# HTML Compression - https://jch.penibelst.de/
compress_html:
  clippings: all
  ignore:
    envs: development
